<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>CODE STACKS</title>
<style>
body{margin:0;background:#07080d;color:#e7edf7;font-family:Segoe UI,Tahoma,sans-serif;padding:28px}
h1{margin:0;font-size:36px} h1 span{color:#3de0ff}
.tag{color:#9eb0c7}
button{padding:10px 16px;margin:8px 8px 0 0;border:0;border-radius:10px;background:#1b2230;color:#e7edf7;cursor:pointer}
button.go{background:#3de0ff;color:#041016;font-weight:700}
input{width:90%;padding:8px;background:#10141e;color:#e7edf7;border:1px solid #243044;border-radius:8px}
#ok{color:#7cff6b} .bad{color:#ff6b6b}
</style>
</head>
<body>
<h1>CODE <span>STACKS</span></h1>
<p class="tag">v1.36 one-file table</p>
<p id="ok">If this line stays gray, use Chrome, not IE.</p>
<p>
<button type="button" class="go" onclick="mode='js';hint()">First Blood JS</button>
<button type="button" onclick="mode='tiny';hint()">Tiny Blood</button>
</p>
<p id="spec"></p>
<p><input id="line" type="text" /></p>
<p><button type="button" class="go" onclick="go()">Stack line</button></p>
<p id="out"></p>
<script>
var mode = "js";
document.getElementById("ok").innerHTML = "Ready.";
function hint() {
  var i = document.getElementById("line");
  var s = document.getElementById("spec");
  if (mode === "tiny") { s.innerHTML = "Tiny: print CODE STACKS"; i.value = "print CODE STACKS"; }
  else { s.innerHTML = "JS: console.log(\"CODE STACKS\");"; i.value = "console.log(\"CODE STACKS\");"; }
  document.getElementById("out").innerHTML = "";
}
hint();
function go() {
  var t = document.getElementById("line").value;
  var out = document.getElementById("out");
  if (mode === "tiny") {
    var s = t.replace(/^\s+|\s+$/g, "");
    var p = s.indexOf(" ");
    var cmd = (p < 0 ? s : s.slice(0, p)).toLowerCase();
    var rest = p < 0 ? "" : s.slice(p + 1).replace(/^\s+|\s+$/g, "");
    if ((cmd === "print" || cmd === "say") && rest === "CODE STACKS") out.innerHTML = "SHIPPED.";
    else { out.className = "bad"; out.innerHTML = "Need: print CODE STACKS"; }
    return;
  }
  var logs = [];
  try {
    var c = { log: function (x) { logs.push(String(x)); } };
    (new Function("console", t))(c);
    if (logs.length === 1 && logs[0] === "CODE STACKS") { out.className = ""; out.innerHTML = "SHIPPED."; }
    else { out.className = "bad"; out.innerHTML = "Logged: " + (logs.join(",") || "nothing"); }
  } catch (e) { out.className = "bad"; out.innerHTML = e.message; }
}
</script>
</body>
</html>
